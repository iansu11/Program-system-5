<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 解題系統 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body style="display: flex; flex-direction: row; height: 100vh; background: #232731; color: white;">

    <!-- 左側封面 -->
    <div class="login-left-cover" style="opacity: 0; transition: opacity 0.3s ease;" id="leftCover"></div>

    <!-- 右側登入表單 -->
    <div class="login-right-form" style="opacity: 0; transition: opacity 0.3s ease;" id="rightForm">
        <div class="portal-container" style="padding-top: 30px;">
            <h1 style="color: #60a5fa; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i class="fa-solid fa-code"></i> 解題系統 V2
            </h1>
            
            <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;">
                <div id="tabLogin" style="cursor:pointer; font-weight:bold; color:white; border-bottom: 2px solid var(--accent); padding-bottom:5px;" onclick="switchAuthTab('login')">
                    登入現有帳號
                </div>
                <div id="tabRegister" style="cursor:pointer; font-weight:bold; color:#aaa; border-bottom: 2px solid transparent; padding-bottom:5px;" onclick="switchAuthTab('register')">
                    註冊並綁定雲端
                </div>
            </div>

            <div style="text-align: left;">
                <label style="color: #bbb; font-size: 0.9rem; margin-bottom: 5px; display: block;">電子郵件</label>
                <input type="email" id="emailInput" class="auth-input" placeholder="example@email.com">

                <label style="color: #bbb; font-size: 0.9rem; margin-bottom: 5px; display: block;">密碼</label>
                <input type="password" id="passwordInput" class="auth-input" placeholder="至少 6 位數密碼" onkeypress="if(event.key === 'Enter') handleAuthAction()">

                <div id="registerConfigArea" style="display:none; margin-top: 10px;">
                    <label style="color: #f59e0b; font-size: 0.9rem; margin-bottom: 5px; display: block;">
                        <i class="fa-solid fa-cloud"></i> Firebase 私有雲端 JSON 金鑰
                    </label>
                    <textarea id="registerConfigInput" class="auth-input" style="height: 100px; resize: none; font-family: 'Consolas', monospace; font-size: 0.8rem;" placeholder='{"apiKey": "...", "authDomain": "..."}'></textarea>
                </div>
            </div>

            <button id="actionBtn" class="btn btn-success" style="width: 100%; padding: 15px; font-size: 1.1rem; margin-top: 20px;" onclick="handleAuthAction()">
                登入系統
            </button>
        </div>
    </div>

    <!-- 載入邏輯 -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 初始化登入頁面的特有狀態
        let isLoginMode = true;
        function switchAuthTab(mode) {
            isLoginMode = (mode === 'login');
            document.getElementById('tabLogin').style.color = isLoginMode ? 'white' : '#aaa';
            document.getElementById('tabLogin').style.borderBottomColor = isLoginMode ? 'var(--accent)' : 'transparent';
            document.getElementById('tabRegister').style.color = !isLoginMode ? 'white' : '#aaa';
            document.getElementById('tabRegister').style.borderBottomColor = !isLoginMode ? 'var(--accent)' : 'transparent';
            
            document.getElementById('registerConfigArea').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('actionBtn').innerText = isLoginMode ? '登入系統' : '註冊並綁定雲端';
            document.getElementById('actionBtn').className = isLoginMode ? 'btn btn-success' : 'btn btn-primary';
        }
    </script>
</body>
</html>
