<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者後台 - 解題系統 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        .auth-input {
            background-color: #ffffff !important;
            color: #333333 !important;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .auth-input:focus {
            outline: none;
            border-color: #8b5cf6 !important;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25) !important;
        }
    </style>
</head>
<body style="background-color: var(--bg-page-light); color: #333; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
    
    <div class="topbar">
        <div class="logo-section" onclick="window.location.href='/dashboard.html'">
            <i class="fa-solid fa-code"></i> 解題系統 V2
        </div>
        <div class="user-profile">
            <span id="user-name-admin" class="user-name-display" style="font-size: 0.95rem; font-weight: 500;">載入中...</span>
            <div class="user-avatar" style="background-color: #8b5cf6;"><i class="fa-solid fa-crown"></i></div>
            <button class="btn btn-outline btn-sm" style="margin-left: 10px;" onclick="window.location.href='/dashboard.html'">返回大廳</button>
        </div>
    </div>

    <div class="page-view active" style="display: block;  width: 100%; overflow-y: auto; padding: 30px;">
        <div class="page-header" style="margin-bottom: 30px;">
            <div>
                <h1 style="color: #8b5cf6; margin:0 0 5px 0;"><i class="fa-solid fa-crown"></i> 系統管理者後台</h1>
                <p style="color: var(--text-muted); margin:0;">管理系統公告與設定 GitHub 預設題庫連動機制。</p>
            </div>
        </div>

        <!-- 公告管理 -->
        <div class="saas-card" style="margin-bottom: 30px; cursor: default; transform: none;">
            <h3 style="margin-top:0; color: #1e293b; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px;"><i class="fa-solid fa-bullhorn" style="color: #3b82f6;"></i> 系統公告管理</h3>
            
            <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                <input type="text" id="announcementInput" class="auth-input" style="flex:1; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px;" placeholder="輸入新公告內容...">
                <button class="btn btn-primary" onclick="addAnnouncement()">發布公告</button>
            </div>
            
            <div id="admin-announcements-list" style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; min-height: 100px; background: #fafafa;">
                載入中...
            </div>
        </div>

        <!-- GitHub 設定 -->
        <div class="saas-card" style="margin-bottom: 30px; cursor: default; transform: none;">
            <h3 style="margin-top:0; color: #1e293b; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px;"><i class="fa-brands fa-github" style="color: #24292e;"></i> GitHub 預設題庫部署設定</h3>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 15px;">
                將您的自訂題庫直接覆寫推播至 GitHub 上，成為全系統的預設官方題庫。<br>
                前端大廳會自動從此儲存庫的 main 分支讀取 <code>raw.githubusercontent.com</code> 的資料。
            </p>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px;">GitHub 擁有者 (Owner)</label>
                    <input type="text" id="ghOwner" class="auth-input" style="width: 100%; border: 1px solid #d1d5db; padding: 8px;" placeholder="例如: iansu11">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px;">儲存庫名稱 (Repo)</label>
                    <input type="text" id="ghRepo" class="auth-input" style="width: 100%; border: 1px solid #d1d5db; padding: 8px;" placeholder="例如: program-bank">
                </div>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px;">Personal Access Token (PAT) <span style="color: #ef4444;">* 需具備 repo 權限</span></label>
                <input type="password" id="ghToken" class="auth-input" style="width: 100%; border: 1px solid #d1d5db; padding: 8px;" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            </div>
            <button class="btn btn-outline" style="width: 100%; margin-bottom: 25px;" onclick="saveGitHubSettings()">💾 儲存 GitHub 設定</button>

            <!-- 題庫發布區 -->
            <h4 style="margin: 0 0 10px 0; color: #1e293b;">一鍵部署自訂題庫</h4>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                <select id="sourceBankSelect" class="auth-input" style="flex:1; border: 1px solid #d1d5db; padding: 10px;">
                    <option value="">載入中...</option>
                </select>
                <i class="fa-solid fa-arrow-right" style="color: #94a3b8;"></i>
                <select id="targetBankSelect" class="auth-input" style="flex:1; border: 1px solid #d1d5db; padding: 10px;">
                    <option value="program-1.json">📚 114-第一學期程式設計</option>
                    <option value="program-oop.json">🏆 114-第二學期物件導向</option>
                    <option value="program-exam.json">🔥 其他題目選集</option>
                </select>
            </div>
            <button id="publishBtn" class="btn btn-primary" style="width: 100%; background: #24292e;" onclick="publishToGitHub()">
                <i class="fa-solid fa-cloud-arrow-up"></i> 發布至 GitHub
            </button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin_panel.js"></script>
</body>
</html>
