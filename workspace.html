<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程式開發區 - 解題系統 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body style="background-color: var(--bg-page-light); color: #333; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- 導航列 -->
    <div style="background: var(--bg-header-blue); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <h3 style="margin: 0; display:flex; align-items:center; gap:10px;">
            <button class="btn btn-outline btn-sm" style="color:white; border-color:white; padding:4px 8px;" onclick="goBackToProblemList()">
                <i class="fa-solid fa-arrow-left"></i> 返回
            </button>
            程式開發區
        </h3>
        <div style="display:flex; align-items: center; gap: 15px;">
            <span id="user-name" style="font-size: 0.9rem; color: #cbd5e1;"></span>
            <button class="btn btn-outline" style="color: white; border-color: white;" onclick="logout()">登出</button>
        </div>
    </div>

<div id="view-workspace">
    <div class="ws-layout">
        <!-- 題目說明區塊 -->
        <div class="ws-left" id="wsLeft">
            <div class="ws-header">
                <h3 id="probTitle" style="margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-file-lines" style="color: #60a5fa;"></i> 載入中...
                </h3>
            </div>
            <div id="probDesc" class="ws-content prob-desc-content markdown-body">
                <!-- 題目敘述由 JS 填入 -->
            </div>
        </div>
        
        <!-- 分隔線 (拖曳調整大小) -->
        <div class="ws-resizer" id="wsResizer"></div>
        
        <!-- 程式碼編輯與執行區塊 -->
        <div class="ws-right" id="wsRight">
            <div class="ws-header">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="langSelect" class="lang-select" onchange="changeLang()">
                        <option value="cpp">C / C++</option>
                        <option value="python">Python</option>
                    </select>
                    <button class="btn btn-outline btn-sm" onclick="downloadCode()"><i class="fa-solid fa-download"></i> 下載</button>
                    <button class="btn btn-outline btn-sm" onclick="copyCode()"><i class="fa-regular fa-copy"></i> 複製</button>
                    <button class="btn btn-outline btn-sm" onclick="showHistory()"><i class="fa-solid fa-clock-rotate-left"></i> 紀錄</button>
                    <label class="btn btn-outline btn-sm" style="cursor:pointer; margin:0;">
                        <i class="fa-solid fa-upload"></i> 上傳
                        <input type="file" id="codeUploadInput" style="display:none;" accept=".c,.cpp,.h,.py,.txt,.zip" multiple onchange="handleCodeUpload(this)">
                    </label>
                    <div class="font-controls">
                        <button class="btn btn-outline btn-sm" onclick="changeFontSize(-1)">A-</button>
                        <button class="btn btn-outline btn-sm" onclick="changeFontSize(1)">A+</button>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="compileMode" class="lang-select" onchange="changeCompileMode()">
                        <option value="wandbox">🌐 雲端編譯 (Wandbox)</option>
                        <option value="local">💻 本機編譯 (Antigravity CLI)</option>
                    </select>
                    <button class="btn btn-primary" onclick="runCode()"><i class="fa-solid fa-play"></i> 執行程式</button>
                </div>
            </div>
            
            <div id="workspaceTabs" style="display:none; background:#1e1e1e; border-bottom:1px solid #333; padding:5px 10px; gap:5px; overflow-x:auto;">
                <!-- 多檔案分頁由 JS 產生 -->
            </div>
            
            <div class="ws-content" style="padding: 0;">
                <div id="editor" style="width: 100%; height: 100%;"></div>
            </div>
            
            <div class="output-panel">
                <div class="output-header">執行輸出結果</div>
                <pre id="outputContent" class="output-content">準備就緒...</pre>
            </div>
        </div>
    </div>
</div>

<div id="historyModal" class="modal">
    <div class="modal-box" style="width: 800px; max-width: 90vw;">
        <h3 style="margin-top:0;"><i class="fa-solid fa-clock-rotate-left"></i> 執行紀錄</h3>
        <div style="display:flex; gap:20px; height: 400px;">
            <div id="historyList" style="width:250px; overflow-y:auto; border-right:1px solid #ddd; padding-right:10px;">
                <!-- 紀錄列表 -->
            </div>
            <div style="flex:1; display:flex; flex-direction:column;">
                <textarea id="historyCodeView" readonly style="flex:1; background:#1e1e1e; color:#d4d4d4; font-family:monospace; padding:10px; border:none; resize:none;"></textarea>
                <div style="text-align:right; margin-top:10px;">
                    <button class="btn btn-primary" onclick="restoreHistoryCode()">載入此代碼</button>
                </div>
            </div>
        </div>
        <div style="text-align:right; margin-top:15px; border-top:1px solid #ddd; padding-top:10px;">
            <button class="btn btn-outline" onclick="document.getElementById('historyModal').style.display='none'">關閉</button>
        </div>
    </div>
</div>

<div id="updateToast">
    <span style="font-weight: bold; font-size: 1.1rem;">✨ 發現題庫有新版本！</span>
    <button class="btn" style="background: white; color: #059669;" onclick="applyUpdate()">立即同步</button>
</div>

    <script src="/js/config.js?v=10"></script>
    <script src="/js/db.js?v=10"></script>
    <script src="/js/workspace.js?v=10"></script>
    <script src="/js/auth.js?v=10"></script>
</body>
</html>
