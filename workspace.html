<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程式作答區</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body style="background-color: var(--bg-page-light); color: #333; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">



    <div id="view-workspace" style="flex:1; display:flex; flex-direction:column; width:100%; overflow:hidden;">
        <div class="ws-header">
            <div style="flex: 0 0 30%; max-width: 30%; min-width: 250px; display: flex; align-items: center; justify-content: flex-start; padding: 0 5px 0 30px; box-sizing: border-box; border-right: 1px solid rgba(0,0,0,0.3);">
                <span id="wsTitle" style="font-weight:bold; font-size:1.25rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 100%; cursor:pointer;" onclick="window.location.href='/categories'" title="返回題庫">題目名稱</span>
            </div>
            <div style="flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 15px 0 15px; box-sizing: border-box; overflow-x: visible; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 8px; margin-left: -24px;">
                    <button class="header-btn btn-sm" style="padding: 4px 8px; font-size: 0.8rem; flex-shrink: 0;" onclick="goToAdmin()">⚙️ 設定</button>

                    <select id="langSelect" onchange="changeWorkspaceLang()">
                        <option value="cpp">C++ (GCC)</option>
                        <option value="python">Python 3</option>
                    </select>
                    <button class="btn btn-outline btn-sm" onclick="adjustFontSize(-1)" title="縮小字體">A-</button>
                    <button class="btn btn-outline btn-sm" onclick="adjustFontSize(1)" title="放大字體">A+</button>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end;">
                    <button id="modeBtn" class="btn btn-outline btn-sm" style="color: var(--accent); border-color: var(--accent);" onclick="toggleCompileMode()">☁️ 雲端編譯</button>
                    <input type="file" id="codeUploadInput" style="display:none;" accept=".cpp,.h,.py,.zip" multiple onchange="handleCodeUpload(this)">
                    <button class="btn btn-outline btn-sm" onclick="document.getElementById('codeUploadInput').click()">📤 上傳</button>
                    <button class="btn btn-outline btn-sm" onclick="downloadCode()">📥 下載</button>
                    <button class="btn btn-ai btn-sm" style="padding: 4px 8px; font-size: 0.8rem;" onclick="openAIHelperModal()">🤖 AI 診斷</button>
                    <button class="btn btn-outline btn-sm" onclick="copyCode()">📋 複製</button>
                    <button class="btn btn-outline btn-sm" onclick="resetCode()">🔄 重置</button>
                    <button class="btn btn-success btn-sm" style="height: 32px; display: inline-flex; align-items: center;" id="runBtn" onclick="runCode()">▶️ 執行</button>
                </div>
            </div>
        </div>
        <div class="ws-container">
            <div class="pane-left">
                <h3 style="margin-top:0; color:var(--accent); border-bottom:1px solid #ccc; padding-bottom:10px;">題目描述</h3>
                <div id="wsDesc" class="problem-content"></div>
            </div>
            <div class="pane-right" id="paneRight">
                <div class="editor-tabs" id="wsEditorTabs" style="display:none;"></div>

                <div id="editor"></div>
                <div class="resizer-bar" id="dragHandle"><div class="resizer-icon"></div></div>
                <div class="console-area" id="consoleArea">
                    <div class="console-header">執行結果 (Output)</div>
                    <div id="outputLogs"><div style="color:#666;">等待執行...</div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-box" style="width: 800px; max-width: 90vw;">
            <h3 style="margin-top:0;"><i class="fa-solid fa-clock-rotate-left"></i> 執行紀錄</h3>
            <div style="display:flex; gap:20px; height: 400px;">
                <div id="historyList" style="width:250px; overflow-y:auto; border-right:1px solid #ddd; padding-right:10px;">
                    <!-- 紀錄列表 -->
                </div>
                <div style="flex:1; display:flex; flex-direction:column;">
                    <textarea id="historyCodeView" readonly style="flex:1; background:#1e1e1e; color:#d4d4d4; font-family:monospace; padding:10px; border:none; resize:none;"></textarea>
                    <div style="text-align:right; margin-top:10px;">
                        <button class="btn btn-primary" onclick="restoreHistoryCode()">載入此代碼</button>
                    </div>
                </div>
            </div>
            <div style="text-align:right; margin-top:15px; border-top:1px solid #ddd; padding-top:10px;">
                <button class="btn btn-outline" onclick="document.getElementById('historyModal').style.display='none'">關閉</button>
            </div>
        </div>
    </div>

    <div id="updateToast">
        <span style="font-weight: bold; font-size: 1.1rem;">✨ 發現題庫有新版本！</span>
        <button class="btn" style="background: white; color: #059669;" onclick="applyUpdate()">立即同步</button>
    </div>

    <script src="/js/config.js?v=11"></script>
    <script src="/js/db.js?v=11"></script>
    <script src="/js/workspace.js?v=11"></script>
    <script src="/js/auth.js?v=11"></script>

    <script>
        // 確保不依賴舊事件，當 window 載入、且 db 已從本地/雲端就緒後啟動
        async function startWorkspace() {
            if (typeof db === 'undefined') {
                setTimeout(startWorkspace, 100);
                return;
            }
            if (!db.problems || db.problems.length === 0) {
                // 如果沒有抓到題庫資料，嘗試主動載入
                if (typeof fetchAndLoadBank === 'function' && typeof currentBankUrl !== 'undefined') {
                    await fetchAndLoadBank(currentBankUrl);
                } else {
                    setTimeout(startWorkspace, 100);
                    return;
                }
            }
            initWorkspace();
        }

        // 當網頁的 HTML 結構一排好，立刻啟動守門員巡檢
        window.addEventListener('DOMContentLoaded', startWorkspace);
    </script>

</body>
</html>
