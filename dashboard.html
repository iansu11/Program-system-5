<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>題庫大廳 - 解題系統 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errDiv = document.createElement('div');
            errDiv.style = "position:fixed; top:50px; left:0; right:0; background:red; color:white; padding:20px; z-index:99999;";
            errDiv.innerHTML = `JS ERROR: ${message} at ${source}:${lineno}`;
            document.body.appendChild(errDiv);
        };
        window.addEventListener("unhandledrejection", function(e) {
            const errDiv = document.createElement('div');
            errDiv.style = "position:fixed; top:120px; left:0; right:0; background:orange; color:white; padding:20px; z-index:99999;";
            errDiv.innerHTML = `PROMISE ERROR: ${e.reason}`;
            document.body.appendChild(errDiv);
        });
    </script>
</head>
<body style="background-color: var(--bg-page-light); color: #333; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
        
    <!-- 導航列 -->
    <div style="background: var(--bg-header-blue); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <h3 style="margin: 0;">解題系統 V2</h3>
        <div style="display:flex; align-items: center; gap: 15px;">
            <span id="user-name" style="font-size: 0.9rem; color: #cbd5e1;"></span>
            <button class="btn btn-outline" style="color: white; border-color: white;" onclick="logout()">登出</button>
        </div>
    </div>
    <!-- 視圖：題庫來源選擇 -->
    <div id="view-source-selector" style="flex: 1;">
    <div class="portal-container">

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2);">
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="text-align:left;">
                    <div style="font-size:0.9rem; color:#ccc;">目前登入身分:</div>
                    <div id="user-name" style="font-weight:bold; font-size:1.3rem; color:white; letter-spacing: 1px;"></div>
                </div>
            </div>
            <button class="btn btn-outline btn-sm" style="color:white; border-color:white; padding: 8px 15px;" onclick="logout()">登出系統</button>
        </div>    

 	<h2 style="font-size: 2rem; margin-bottom: 10px; margin-top: 0; letter-spacing: 1px;">請選擇題庫來源</h2>

    	<div class="portal-grid">
            <button class="bank-btn" style="align-items: flex-start; text-align: left; padding-left: 20px;" onclick="navigateTo('/portal')">

                    <div style="font-size: 1.75rem;"><i class="fa-solid fa-book" style="color: #f472b6;"></i> 系統預設題庫</div>
                    <div style="font-size: 1rem; font-weight: normal; opacity: 0.7;">載入官方練習題</div>
                
            </button>

            <button class="bank-btn" style="align-items: flex-start; text-align: left; padding-left: 20px;" onclick="navigateTo('/custom-portal')">

                    <div style="font-size: 1.75rem;"><i class="fa-solid fa-wrench" style="color: #a78bfa;"></i> 個人自訂題庫</div>
                    <div style="font-size: 1rem; font-weight: normal; opacity: 0.7;">管理個人雲端資料</div>

            </button>
            
    	</div>
    </div>
</div>

<div id="view-custom-portal" style="display:none; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:40px; height:100%; background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%); color:white; overflow-y:auto; flex: 1;">
 
    <div class="portal-container">
    	<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:15px;">
            <h2 style="margin:0;"><i class="fa-solid fa-wrench" style="color: #a78bfa;"></i> 個人自訂題庫</h2>
            <div style="display:flex; gap:10px;">
            	<button id="bankSortBtn" class="btn btn-outline" style="color:white; border-color:white;" onclick="toggleBankSortMode()">排序調整模式</button>
            	<button class="btn btn-success" onclick="addCustomBank()">+ 新增題庫</button>
            </div>
    	</div>
    	<div id="customBankList" class="portal-grid"></div>
    </div>
</div>


<div id="view-portal" style="flex: 1;">
    <div class="portal-container">
        
        <h2 style="font-size: 2rem; margin-bottom: 10px; margin-top: 0; letter-spacing: 1px;">系統預設題庫</h2>
        <p style="color: #a7f3d0; margin-bottom: 30px;">✨ 雲端同步已開啟，作答紀錄永久保留於您的帳號</p>
        
        <div class="portal-grid">
            <button class="bank-btn" onclick="fetchAndLoadBank('https://raw.githubusercontent.com/iansu11/Program-system-5/main/program-1.json', '🖥️ 114-第一學期程式設計')">
                <span>🖥️ 114-第一學期程式設計</span>
                <span class="bank-desc">載入 114 的題目</span>
            </button>
            <button class="bank-btn" onclick="fetchAndLoadBank('https://raw.githubusercontent.com/iansu11/Program-system-5/main/program-oop.json', '☕ 114-第二學期物件導向')">
                <span>☕ 114-第二學期物件導向</span>
                <span class="bank-desc">載入 114 的題目</span>
            </button>
            <button class="bank-btn" onclick="fetchAndLoadBank('https://raw.githubusercontent.com/iansu11/Program-system-5/main/program-exam.json', '⭐ 自訂題目')">
                <span>⭐ 自訂題目</span>
                <span class="bank-desc">載入 自訂 題目</span>
            </button>
        </div>
    </div>
</div>

    <!-- 視圖：分類列表 -->
    <div id="view-categories" style="flex: 1;">
        <div style="max-width: 1400px; margin: 0 auto; width: 100%;">
        <div class="page-header">
            <div style="display:flex; align-items:center; gap:15px;">
                <h2 id="currentBankName" style="margin:0; color:#111827;"><i class="fa-solid fa-folder-open" style="color: #2563eb; margin-right: 8px;"></i> 目前題庫</h2>
            </div>
            
            <div style="display:flex; gap:10px; flex-wrap: wrap; align-items: center; justify-content: flex-end;">
                <button id="catSortBtn" class="btn btn-outline btn-header-action" onclick="toggleCatSortMode()">排序調整模式</button>
                <button class="btn btn-outline btn-header-action" onclick="openBackupUI()">💾 備份/還原</button>
                <button class="btn btn-warning" onclick="resetCurrentBank()">重新載入題庫</button>
                <button class="btn btn-danger" onclick="hardResetAll()">⚠️ 全部重置</button>
                <button class="btn btn-primary" onclick="createCategory()">+ 新增分類</button>
            </div>
        </div>
        <div id="categoryList" class="cat-grid"></div>
    </div>
</div>

    <!-- 視圖：題目列表 -->
    <div id="view-problem-list" style="flex: 1;">
        <div style="max-width: 900px; margin: 0 auto; width: 100%;">
        <div class="page-header">
            <div style="display:flex; align-items:center; gap:15px;">
                <h2 id="currentCatTitle" style="margin:0; color:#2563eb;">分類名稱</h2>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-danger" onclick="clearCategoryHistory()"><i class="fa-solid fa-trash"></i> 清空歷史紀錄</button>
                <button id="probSortBtn" class="btn btn-outline btn-header-action" onclick="toggleProbSortMode()">排序調整模式</button>
                <button class="btn btn-primary" onclick="createProblemInCat()">+ 新增題目</button>
            </div>
        </div>
        <div id="probListContainer" class="prob-list-container"></div>
        <div id="emptyMsg" style="text-align:center; color:#4b5563; margin-top:50px; display:none;">
            此分類暫無題目，請點擊右上角新增。
        </div>
    </div>
</div>

<div id="backupModal" class="modal">
    <div class="modal-box" style="width:500px;">
        <h3>💾 資料備份/還原 (V72 雲端版)</h3>
        <textarea id="backupStr" style="width:100%; height:100px; margin-bottom:10px;" placeholder="Backup Code (Base64)..."></textarea>
        
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:15px;">
             <input type="file" id="backupFileInput" accept=".txt,.json" style="display:none" onchange="handleBackupFile(this)">
             <button class="btn btn-outline btn-sm" onclick="document.getElementById('backupFileInput').click()"><i class="fa-solid fa-folder-open" style="color: #60a5fa; margin-right: 8px;"></i> 選擇檔案</button>
             <button class="btn btn-success btn-sm" onclick="downloadBackup()">📥 下載檔案</button>
        </div>

        <div style="display:flex; justify-content:space-between; border-top:1px solid #333; padding-top:15px;">
            <button class="btn btn-outline" onclick="document.getElementById('backupModal').style.display='none'">取消</button>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="copyBackupCode()">📋 複製代碼</button>
                <button class="btn btn-danger" onclick="execRestore()">⚠️ 確認還原</button>
            </div>
        </div>
    </div>
</div>

<div id="moveProblemModal" class="modal">
    <div class="modal-box" style="width:400px;">
        <h3 style="margin-top:0; color:var(--accent);">📦 移動題目至其他分類</h3>
        <p style="color:#aaa; font-size:0.9rem; margin-top:-5px;">請選擇您想將此題目移動到的目標分類：</p>
        
        <select id="moveCategorySelect" style="width:100%; margin-bottom:20px; background:#121212; color:#fff; border:1px solid #444; padding:10px; border-radius:6px; font-size:1rem;">
        </select>
        
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-outline" onclick="document.getElementById('moveProblemModal').style.display='none'">取消</button>
            <button class="btn btn-primary" onclick="confirmMoveProblem()">✅ 確認移動</button>
        </div>
    </div>
</div>

<div id="updateToast">
    <span style="font-weight: bold; font-size: 1.1rem;">✨ 發現題庫有新版本！</span>
    <button class="btn" style="background: white; color: #059669;" onclick="applyUpdate()">立即同步</button>
</div>

    <script src="/js/config.js?v=10"></script>
    <script src="/js/db.js?v=10"></script>
    <script src="/js/dashboard.js?v=10"></script>
    <script src="/js/auth.js?v=10"></script>
</body>
</html>
