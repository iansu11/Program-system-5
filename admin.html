<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>題目編輯後台 - 解題系統 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: var(--bg-page-light); color: #333; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
    
    <!-- 導航列 -->
    <div style="background: var(--bg-header-blue); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <h3 style="margin: 0; display:flex; align-items:center; gap:10px;">
            <button class="btn btn-outline btn-sm" style="color:white; border-color:white; padding:4px 8px;" onclick="goBackToProblemList()">
                <i class="fa-solid fa-arrow-left"></i> 返回
            </button>
            題目編輯後台
        </h3>
        <div style="display:flex; align-items: center; gap: 15px;">
            <span id="user-name" style="font-size: 0.9rem; color: #cbd5e1;"></span>
            <button class="btn btn-outline" style="color: white; border-color: white;" onclick="logout()">登出</button>
        </div>
    </div>

<div id="view-admin">
    <div class="admin-toolbar">
        <div style="display:flex; gap:10px; align-items:center;">
            <select id="adminLangSelect" class="lang-select" style="background:#fff; color:#333;" onchange="changeAdminLang()">
                <option value="cpp">C / C++ 模板</option>
                <option value="python">Python 模板</option>
            </select>
            <label style="color:white; display:flex; align-items:center; gap:5px; cursor:pointer; font-size:0.9rem;">
                <input type="checkbox" id="isMultiFileCheck" onchange="toggleAdminMultiFile()">
                啟用多檔案專案
            </label>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-success" onclick="saveProblem()"><i class="fa-solid fa-floppy-disk"></i> 儲存所有變更</button>
        </div>
    </div>

    <!-- 標題輸入區 -->
    <div style="padding: 15px; background: white; border-bottom: 1px solid #ddd; display: flex; gap: 15px; align-items: center;">
        <div style="flex:1;">
            <label style="font-size: 0.85rem; color: #666; font-weight: 500;">題目名稱</label>
            <input type="text" id="editTitle" placeholder="請輸入題目名稱..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box;">
        </div>
        <div>
            <label style="font-size: 0.85rem; color: #666; font-weight: 500;">分類 ID (唯讀)</label>
            <input type="text" id="editCatId" readonly style="width: 150px; padding: 8px; border: 1px solid #eee; background: #f9fafb; border-radius: 4px; font-size: 1rem; box-sizing: border-box; color:#9ca3af;">
        </div>
    </div>

    <!-- 編輯器區塊 -->
    <div class="ws-layout" style="flex: 1; height: 0;">
        <div class="ws-left" id="adminLeft" style="display:flex; flex-direction:column;">
            <div style="padding:10px; background:#f1f5f9; border-bottom:1px solid #e2e8f0; font-weight:bold; color:#334155; font-size:0.9rem;">
                📝 題目敘述 (支援 Markdown 語法)
            </div>
            <textarea id="editDesc" class="admin-textarea" placeholder="# 題目敘述\n\n在此輸入題目的 Markdown 內容..."></textarea>
            
            <div style="padding:10px; background:#f1f5f9; border-top:1px solid #e2e8f0; border-bottom:1px solid #e2e8f0; font-weight:bold; color:#334155; font-size:0.9rem;">
                ✅ 標準答案 (用於線上批改)
            </div>
            <textarea id="modelAnswerInput" class="admin-textarea" style="flex: 0.5;" placeholder="請輸入預期的標準執行輸出...\n如果有多種可能，請用 || 分隔 (例如: true||1)"></textarea>
        </div>
        
        <div class="ws-resizer" id="adminResizer"></div>
        
        <div class="ws-right" id="adminRight" style="display:flex; flex-direction:column;">
            <div style="padding:10px; background:#f1f5f9; border-bottom:1px solid #e2e8f0; font-weight:bold; color:#334155; font-size:0.9rem; display:flex; justify-content:space-between; align-items:center;">
                <span>💻 初始程式碼模板</span>
                <div id="adminFileTabsContainer" style="display:none; gap:5px; flex-wrap:wrap;"></div>
            </div>
            <textarea id="editTemplate" class="admin-textarea" style="font-family: monospace; background:#1e1e1e; color:#d4d4d4;" placeholder="// 學生看到的初始程式碼..."></textarea>
        </div>
    </div>
</div>

<div id="updateToast">
    <span style="font-weight: bold; font-size: 1.1rem;">✨ 發現題庫有新版本！</span>
    <button class="btn" style="background: white; color: #059669;" onclick="applyUpdate()">立即同步</button>
</div>

    <script src="/js/config.js?v=13"></script>
    <script src="/js/db.js?v=13"></script>
    <script src="/js/admin.js?v=13"></script>
    <script src="/js/auth.js?v=13"></script>
</body>
</html>
