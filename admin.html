<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>題目編輯後台 - 解題系統 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        #view-admin { 
            display: none; 
            height: 100%; 
            flex-direction: column; 
            background: var(--bg-page-light); 
        }

        .admin-toolbar { 
            height: 50px; 
            background: var(--bg-header-blue); 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 20px; 
            flex-shrink: 0; 
            color: white; 
        }

        .admin-content-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        .admin-col-left { 
            flex: 0 0 35%; 
            max-width: 35%; 
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid #ccc; 
            padding: 25px; 
            background: var(--bg-pane-light); 
            color: var(--text-pane-light); 
            overflow-y: auto; 
            box-sizing: border-box; 
        }

        .admin-col-left input, 
        .admin-col-left textarea { background: var(--bg-pane-light); color: #333; border: 1px solid #999; }
        
        .admin-col-left input:focus, 
        .admin-col-left textarea:focus { background: #e8e8e8; outline: 2px solid var(--accent); }
        
        .admin-col-right { flex: 1; display: flex; flex-direction: column; background: #1a1a1a; min-width: 0; color: #e0e0e0; }
        .admin-row-top { flex: 2; display: flex; flex-direction: column; padding: 20px; background: #1e1e1e; min-height: 100px; }
        .admin-row-bottom { flex: 1; display: flex; flex-direction: column; padding: 0; background: #151515; min-height: 100px; overflow: hidden; }
        
        .admin-header-row { 
            position: sticky; 
            top: 0; 
            background: #151515; 
            z-index: 5; 
            padding: 8px 20px; 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        #adminTestCases { padding: 20px; padding-bottom: 40px; overflow-y: auto; flex: 1; }
        .admin-label { color: #555; font-size: 0.9rem; margin-bottom: 5px; display: block; font-weight: 600; }
        .admin-col-right textarea { background: #252526; color: #fff; border: 1px solid #444; }
        
        .admin-col-right .tc-item { 
            background: #1e1e1e; 
            border: 1px solid #333; 
            border-left: 3px solid var(--warning); 
            padding: 10px; 
            margin-bottom: 8px; 
            border-radius: 4px; 
        }

        .admin-col-right .tc-item textarea { 
            background: #151515; 
            border: 1px solid #444; 
            min-height: 38px; 
            max-height: 180px; 
            resize: vertical; 
            overflow-y: auto; 
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            z-index: 999; 
            justify-content: center; 
            align-items: center; 
            backdrop-filter: blur(3px); 
        }

        .modal-box { 
            background: #1e1e1e; 
            color: #e0e0e0; 
            padding: 25px; 
            width: 400px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }

        .modal-box textarea, .modal-box input { background: #121212; color: #fff; border: 1px solid #444; }
        .modal-box .btn-outline { border-color: #555; color: #ccc; }
        .modal-box .btn-outline:hover { background: #333; color: #fff; }

        .hist-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .hist-item:hover { background: #2a2a2a; }
        .hist-item.active { border-left: 3px solid var(--accent); background: #222; }

        #updateToast { 
            display: none; 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: white; 
            padding: 15px 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
            z-index: 9999; 
            align-items: center; 
            gap: 15px; 
            animation: slideIn 0.4s ease-out forwards; 
        }

        @keyframes slideIn { 
            from { transform: translateX(100%); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }
    </style>
</head>
<body style="background-color: var(--bg-page-light); color: #333; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
    
<div id="view-admin">
    <div class="admin-toolbar">
        <h2 style="margin:0;">⚙️ 題目設定</h2>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-outline header-btn" onclick="openHistoryModal()">📜 執行紀錄</button>
            <button class="btn btn-warning" onclick="openModelAnswerUI()">🔑 示範解答</button>
            <button class="btn btn-primary" onclick="saveAdminAndBack()">💾 儲存並返回</button>
        </div>
    </div>
    <div class="admin-content-wrapper">
        <div class="admin-col-left">
            <h3 style="margin-top:0; color:var(--accent);">基本資訊</h3>
            <label class="admin-label">題目名稱</label>
            <input type="text" id="editTitle" style="margin-bottom:20px;">
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <label class="admin-label" style="margin:0;">題目描述 </label>
                <div>
                    <input type="file" id="localImgInput" accept="image/*" style="display:none" onchange="handleLocalImageUpload()">
                    <button class="btn btn-outline btn-sm" style="border-color:#999;" onclick="insertBoldToDesc()">𝐁 粗體</button>
                    <button class="btn btn-outline btn-sm" style="border-color:#999;" onclick="insertImageURL()">🔗 連結</button>
                    <button class="btn btn-outline btn-sm" style="border-color:#999;" onclick="document.getElementById('localImgInput').click()"><i class="fa-solid fa-folder-open" style="color: #60a5fa; margin-right: 8px;"></i> 上傳</button>
                </div>
            </div>
            
            <textarea id="editDesc" style="flex:1; resize:none;" placeholder="在此輸入題目內容。支援圖片語法 ![Alt](URL)。\n直接輸入星號圖形 (***) 或減號 (---) 即可顯示，不會自動變成列表或線條。"></textarea>
        </div>
        <div class="admin-col-right">
            <div class="admin-row-top" id="adminRowTop">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <label class="admin-label" style="color:var(--success); margin:0;">Code Template (預設程式碼)</label>
                    <div style="display:flex; gap:15px; align-items:center;">
                        <label style="color:#bbb; font-size:0.9rem; display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="adminEnableMultiFile" onchange="toggleAdminMultiFile()"> 啟用多檔案 (OOP)
                        </label>
                        <select id="adminLangSelect" style="padding:2px 5px; height:auto;" onchange="changeAdminLang()">
                            <option value="cpp">編輯 C++ 模板</option>
                            <option value="python">編輯 Python 3 模板</option>
                        </select>
                    </div>
                </div>
                <div class="editor-tabs" id="adminEditorTabs" style="display:none; margin-bottom:5px; border-radius:4px;"></div>
                <textarea id="editTemplate" style="flex:1; resize:none; font-family:'Consolas',monospace;" spellcheck="false" placeholder="// 設定該語言的預設代碼..."></textarea>
            </div>
            <div class="resizer-bar" id="adminDragHandle"><div class="resizer-icon"></div></div>
            <div class="admin-row-bottom" id="adminRowBottom">
                <div class="admin-header-row">
                    <span class="admin-label" style="color:#aaa; margin:0;">測試資料 (每行代表一筆輸入/輸出)</span>
                    <button class="btn btn-outline btn-sm" onclick="addTestCaseUI()">+ 新增</button>
                </div>
                <div id="adminTestCases"></div>
            </div>
        </div>
    </div>
</div>

<div id="updateToast">
    <span style="font-weight: bold; font-size: 1.1rem;">🚀 發現題庫有新版本！</span>
    <button class="btn" style="background: white; color: #059669;" onclick="applyUpdate()">立即同步</button>
</div>

<div id="backupModal" class="modal">
    <div class="modal-box" style="width:500px;">
        <h3>📦 資料備份/還原 (V72 雲端版)</h3>
        <textarea id="backupStr" style="width:100%; height:100px; margin-bottom:10px;" placeholder="Backup Code (Base64)..."></textarea>
        
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:15px;">
             <input type="file" id="backupFileInput" accept=".txt,.json" style="display:none" onchange="handleBackupFile(this)">
             <button class="btn btn-outline btn-sm" onclick="document.getElementById('backupFileInput').click()"><i class="fa-solid fa-folder-open" style="color: #60a5fa; margin-right: 8px;"></i> 選擇檔案</button>
             <button class="btn btn-success btn-sm" onclick="downloadBackup()">💾 下載檔案</button>
        </div>

        <div style="display:flex; justify-content:space-between; border-top:1px solid #333; padding-top:15px;">
            <button class="btn btn-outline" onclick="document.getElementById('backupModal').style.display='none'">關閉</button>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="copyBackupCode()">📋 複製代碼</button>
                <button class="btn btn-danger" onclick="execRestore()">⚠️ 開始還原</button>
            </div>
        </div>
    </div>
</div>

<div id="modelAnswerModal" class="modal">
    <div class="modal-box" style="width:600px; max-width:90%; height:500px;">
        <h3>🔑 設定示範解答 (Model Answer)</h3>
        <textarea id="modelAnswerInput" style="flex:1; resize:none; font-family:'Consolas',monospace; background:#1e1e1e; color:#d4d4d4; border:1px solid #333; padding:10px;" placeholder="#include <iostream>..." spellcheck="false"></textarea>
        <div style="display:flex; justify-content:flex-end; margin-top:10px;">
            <div style="display:flex; gap:10px;">
                <button class="btn btn-outline" onclick="document.getElementById('modelAnswerModal').style.display='none'">取消</button>
                <button class="btn btn-copy" onclick="copyModelAnswer()">📋 複製解答</button>
                <button class="btn btn-paste" onclick="pasteModelAnswer()">📋 貼上解答</button>
                <button class="btn btn-primary" onclick="saveModelAnswerFromModal()">✅ 暫存設定</button>
            </div>
        </div>
    </div>
</div>

<div id="aiHelperModal" class="modal">
    <div class="modal-box" style="width:600px; max-width:90%; height:550px;">
        <h3 style="display:flex; align-items:center; gap:10px; color:var(--ai-color); margin-top:0;">
            🤖 AI 程式碼診斷 (傳送門)
        </h3>
        <p style="color:#aaa; font-size:0.9rem; margin-top:-5px;">
            系統已自動生成提問內容。您可以選擇僅複製文字，或複製並開啟新分頁。
        </p>
        <textarea id="aiPromptOutput" style="flex:1; resize:none; font-family:'Consolas',monospace; background:#1e1e1e; color:#d4d4d4; border:1px solid #333; padding:10px; font-size:0.9rem;" readonly></textarea>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
            <button class="btn btn-outline" onclick="document.getElementById('aiHelperModal').style.display='none'">關閉</button>
            <button class="btn btn-primary" onclick="copyPromptOnly()">📋 僅複製</button>
            <button class="btn btn-ai" onclick="copyPromptAndOpenGemini()">🚀 複製並前往 Gemini</button>
        </div>
    </div>
</div>

<div id="historyModal" class="modal">
    <div class="modal-box" style="width:800px; max-width:95%; height:600px;">
        <h3 style="margin-top:0;">📜 歷史執行紀錄</h3>
        <p style="color:#aaa; font-size:0.9rem; margin-top:-5px; margin-bottom:10px;">此處保留您每次點擊「執行測試」的紀錄（最多保留最新 20 筆）。</p>
        
        <div style="display:flex; flex:1; gap:15px; overflow:hidden;">
            <div style="flex:1; overflow-y:auto; background:#121212; border:1px solid #333; border-radius:6px; min-width:200px;" id="historyList"></div>
            <div style="flex:2; display:flex; flex-direction:column;">
                <div style="color:#aaa; font-size:0.9rem; margin-bottom:5px;">當時執行的程式碼：</div>
                <textarea id="historyCodeView" style="flex:1; resize:none; font-family:'Consolas',monospace; background:#1e1e1e; color:#ccc; border:1px solid #333; padding:10px;" readonly></textarea>
            </div>
        </div>
        
        <div style="display:flex; justify-content:space-between; margin-top:15px; flex-shrink:0;">
            <button class="btn btn-danger" onclick="clearProblemHistory()"><i class="fa-solid fa-trash"></i> 清空此題紀錄</button>
            <button class="btn btn-outline" onclick="document.getElementById('historyModal').style.display='none'">關閉</button>
        </div>
    </div>
</div>

    <script src="/js/config.js?v=15"></script>
    <script src="/js/db.js?v=15"></script>
    <script src="/js/admin.js?v=15"></script>
    <script src="/js/auth.js?v=15"></script>
</body>
</html>
